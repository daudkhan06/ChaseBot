<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChaseBot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f6feb'/><path d='M9 17l4 4 10-10' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" /><path d="M9 17l4 4 10-10" /></svg>
      </div>
      <div>
        <div class="brand-name">ChaseBot</div>
        <div class="brand-sub" id="biz-name">Get paid without the awkward emails</div>
      </div>
      <span class="badge" id="mode-badge">…</span>
    </div>
    <div class="top-actions">
      <div class="clock" title="Demo clock: fast-forward time to see the agent handle overdue invoices">
        <span class="clock-label">Today</span>
        <strong id="today">—</strong>
        <button class="chip" data-days="7">+7d</button>
        <button class="chip" data-days="14">+14d</button>
        <button class="chip ghost" id="clock-reset" title="Back to real date">Reset</button>
      </div>
      <label class="switch" title="When on, the agent sends reminders itself. When off, it proposes and you approve.">
        <input type="checkbox" id="autopilot" />
        <span class="track"><span class="thumb"></span></span>
        <span>Autopilot</span>
      </label>
      <button class="icon-btn" id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="kpis" id="kpis"></section>

    <div class="grid">
      <section class="card composer">
        <div class="card-head">
          <h2>Bill a client</h2>
          <span class="muted">Describe the job in your own words</span>
        </div>
        <form id="compose-form">
          <textarea id="compose-text" rows="5" placeholder="e.g. Did 6 hours on the new logo for Sam at Acme Coffee, £40/h, plus £15 for the font licence. Give them 14 days."></textarea>
          <div class="compose-row">
            <label class="attach">
              <input type="file" id="compose-image" accept="image/*" hidden />
              <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
              <span id="attach-label">Attach timesheet / screenshot</span>
            </label>
            <button class="btn primary" type="submit" id="draft-btn">
              <span class="spark">✦</span> Draft with AI
            </button>
          </div>
          <div class="examples">
            <span class="muted">Try:</span>
            <button type="button" class="link" data-example="Sam at Acme Coffee wants the spring menu redesign billed - 2 menus at £180 each, plus 1.5h of revisions at £40/h. Usual 14 days.">Acme menus</button>
            <button type="button" class="link" data-example="Brightside Studio (Jordan Lee) - 3 days of illustration subcontract at £320/day for the Halcyon campaign, plus £45 stock images. 30 day terms.">Brightside subcontract</button>
            <button type="button" class="link" data-example="Priya from Nimbus Youth Charity - annual report layout, 24 pages, flat £650. They're a charity so give them 21 days.">Nimbus report</button>
          </div>
        </form>
        <div id="draft" class="draft" hidden></div>
      </section>

      <section class="card approvals" id="approvals-card">
        <div class="card-head">
          <h2>Agent inbox</h2>
          <button class="btn" id="run-agent">
            <span class="spark">✦</span> Chase overdue invoices
          </button>
        </div>
        <div id="approvals"></div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>Invoices</h2>
        <div class="head-actions">
          <div class="filters" id="filters">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="open">Open</button>
            <button class="chip" data-filter="overdue">Overdue</button>
            <button class="chip" data-filter="paid">Paid</button>
          </div>
          <button class="btn ghost" id="sync-btn" title="Pull latest statuses from PayPal">↻ Sync PayPal</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="invoices">
          <thead>
            <tr><th>Invoice</th><th>Client</th><th class="num">Amount</th><th>Due</th><th>Status</th><th>Agent</th></tr>
          </thead>
          <tbody id="invoice-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button class="icon-btn close" id="drawer-close" aria-label="Close">✕</button>
      <div id="drawer-body"></div>
    </div>
  </aside>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>Settings</h2>
      <label>Business name<input name="businessName" /></label>
      <label>Your name (sign-off)<input name="ownerName" /></label>
      <label>Default currency
        <select name="currency"><option>GBP</option><option>USD</option><option>EUR</option><option>CAD</option><option>AUD</option></select>
      </label>
      <label>Tone for client messages<input name="tone" /></label>
      <div class="dialog-actions">
        <button class="btn ghost" type="button" id="demo-reset">Reset demo data</button>
        <span class="spacer"></span>
        <button class="btn ghost" value="cancel">Cancel</button>
        <button class="btn primary" value="save" id="settings-save">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
